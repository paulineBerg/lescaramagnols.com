<VirtualHost *:80>
    ServerName caramagnols.local
    DocumentRoot /home/surfacepro8/www/caramagnols/backend/public

    RewriteEngine On
    RewriteRule ^ https://caramagnols.local%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName caramagnols.local
    DocumentRoot /home/surfacepro8/www/caramagnols/backend/public

    SSLEngine on
    SSLCertificateFile /home/surfacepro8/certs/caramagnols.local.crt
    SSLCertificateKeyFile /home/surfacepro8/certs/caramagnols.local.key

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS

    <Directory /home/surfacepro8/www/caramagnols/backend/public>
        DirectoryIndex index.php index.html
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/caramagnols.local-error.log
    CustomLog ${APACHE_LOG_DIR}/caramagnols.local-access.log combined
</VirtualHost>
